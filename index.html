<style>
/* layout: full-bleed 3D stage, boss switch on top, attack ledger in a side rail (bottom sheet on phones), tick timeline under the stage */
:root {
  --ground: #0e0a13;
  --rail: #17111f;
  --line: #3a2d47;
  --ink: #ece4f2;
  --dim: #a596b3;
  --accent: #b98cff;
  --strike: #ff6a4d;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-boss="nameless"] { --accent: #e9c46a; --ground: #0b0b10; --rail: #14131a; --line: #3b3628; }
html, body { height: 100%; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px;
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "head rail" "stage rail" "time rail"; overflow: hidden;
}
header {
  grid-area: head; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px;
  padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  border-bottom: 1px solid var(--line);
}
h1 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; margin: 0; text-wrap: balance; }
.tabs { display: flex; gap: 4px; }
.tabs button, .ctrl button, .ctrl select {
  font: 500 14px var(--body); color: var(--dim); background: transparent; border: 1px solid var(--line);
  padding: 8px 12px; border-radius: 2px; cursor: pointer;
}
.tabs button[aria-pressed="true"] { color: var(--ground); background: var(--accent); border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stats { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
#stage { grid-area: stage; position: relative; min-height: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.caption {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 12px; right: 16px; pointer-events: none;
  display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 6px #000;
}
.caption b { font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--accent); }
.caption span { color: var(--ink); max-width: 62ch; }
.timeline {
  grid-area: time; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.ctrl { display: flex; gap: 6px; align-items: center; }
.bar { position: relative; flex: 1; height: 26px; min-width: 0; }
.bar .seg { position: absolute; top: 8px; height: 10px; }
.seg.windup { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.seg.strike { background: var(--strike); }
.seg.recover { background: var(--line); }
.bar input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
.bar .head { position: absolute; top: 2px; width: 2px; height: 22px; background: var(--ink); pointer-events: none; }
.tick { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 92px; text-align: right; font-size: 14px; }
aside {
  grid-area: rail; background: var(--rail); border-left: 1px solid var(--line); overflow-y: auto;
  padding-block: 14px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.lore { color: var(--dim); margin: 0; line-height: 1.45; }
.group h2 { font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px; }
.list { display: flex; flex-direction: column; gap: 2px; }
.list button {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; width: 100%;
  background: transparent; color: var(--ink); border: 0; border-left: 3px solid transparent; padding: 8px 10px; cursor: pointer; font: 15px var(--body);
}
.list button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.list button[aria-pressed="true"] { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.list small { grid-column: 1 / -1; color: var(--dim); font-size: 13px; line-height: 1.35; }
.list em { font-style: normal; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.legal { margin: auto 0 0; color: var(--dim); font-size: 13px; line-height: 1.4; padding-top: 12px; border-top: 1px solid var(--line); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles label { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 14px; cursor: pointer; }
@media (max-width: 820px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(300px, 52vh) auto minmax(0, 1fr); grid-template-areas: "head" "stage" "time" "rail"; overflow: auto; height: auto; min-height: 100%; }
  aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .tick { min-width: 0; }
  h1 { font-size: 24px; }
}
</style>

<header>
  <h1 id="title">Drakhaal</h1>
  <div class="tabs" role="group" aria-label="Boss">

    </div>
  </div>
  <p class="legal">Nezávislý fanúšikovský projekt k módu Cinderhold. Nie je spojený s Mojang ani Microsoft. Stránka nepoužíva cookies, analytiku ani cudzie servery: písma a knižnica three.js (MIT) sú súčasťou webu.</p>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const D = window.DATA;
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = f => { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); };
const pulse = (age, speed, min) => min + (255 - min) * (0.5 + 0.5 * Math.sin(age * speed));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(10, 5.5, 9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 2.5);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 4;
controls.maxDistance = 40;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.45, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const hemi = new THREE.HemisphereLight(0xcbb8e6, 0x1a1020, 1.35);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(6, 12, 8);
scene.add(hemi, sun);

function texture(src) {
  const t = new THREE.TextureLoader().load(src);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function floorTexture(a, b, c) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 64;
  const g = cv.getContext("2d");
  for (let y = 0; y < 64; y += 4) for (let x = 0; x < 64; x += 4) {
    const r = Math.random();
    g.fillStyle = r < 0.12 ? c : r < 0.55 ? a : b;
    g.fillRect(x, y, 4, 4);
  }
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(26, 26);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(26, 26), new THREE.MeshLambertMaterial());
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const grid = new THREE.GridHelper(26, 26, 0x000000, 0x000000);
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.position.y = 0.002;
scene.add(grid);

function buildModel(B) {
  const base = new THREE.MeshLambertMaterial({ map: texture(B.base), alphaTest: 0.1, side: THREE.DoubleSide });
  const glow = new THREE.MeshBasicMaterial({ map: texture(B.glow), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthFunc: THREE.LessEqualDepth, side: THREE.DoubleSide });
  const holder = new THREE.Group();
  const model = new THREE.Group();

const BOSSES = {
  drakhaal: { title: "Drakhaal", sub: "Otec drakov", hp: 500, parts: D.drakhaal.parts.length, model: drak, attacks: DRAK,
    lore: "Tretí brat a pán Wyrmholdu. Bojuje kosou Voidreaper, skáče priestorom a od fázy 2 lieta.",

  nameless: { title: "The Nameless", sub: "Bezmenný", hp: 750, parts: D.nameless.parts.length, model: nameless, attacks: NAMELESS,
    lore: "Drakhaal splodil Prvé vajce z prázdnoty a prázdnota si ho vzala. Bezmenný je ľalia na stonke z nerazených mincí: koruna je telo, stonka drží koreň v zemi.",
    floor: ["#17161e", "#1e1c26", "#3b3628"], cam: [V(12, 8, 16), V(0, 2.4, 2)] },
};

const state = { boss: "drakhaal", idx: 0, t: 0, playing: !REDUCED, speed: 1, phase: 0, loop: true, age: 0 };
const $ = id => document.getElementById(id);
const currentAttack = () => BOSSES[state.boss].attacks[state.idx];
const totalOf = (A, S) => A.totalFor ? A.totalFor(S) : A.total;

function renderList() {
  const B = BOSSES[state.boss];
  const list = $("attacks");
  list.replaceChildren();
  B.attacks.forEach((A, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(i === state.idx));
    const strong = document.createElement("span");
    strong.textContent = A.name;
    const em = document.createElement("em");
    em.textContent = A.code + (A.minPhase ? ` · fáza ${A.minPhase + 1}+` : "");
    const small = document.createElement("small");
    small.textContent = A.desc;
    b.append(strong, em, small);
    b.onclick = () => select(i);
    list.append(b);
  });
}
function select(i) {
  state.idx = i;
  state.t = 0;
  const A = currentAttack();
  if (A.minPhase && state.phase < A.minPhase) { state.phase = A.minPhase; $("opt-phase").value = String(state.phase); }
  if (A.phaseOnly !== undefined) { state.phase = A.phaseOnly; $("opt-phase").value = String(state.phase); }
  renderList();
  timeline();
}
function timeline() {
  const A = currentAttack(), tot = totalOf(A, { phase: state.phase });
  const bar = $("bar");
  bar.querySelectorAll(".seg").forEach(e => e.remove());
  const seg = (cls, a, b) => { if (b <= a) return; const d = document.createElement("div"); d.className = "seg " + cls; d.style.left = (a / tot * 100) + "%"; d.style.width = ((b - a) / tot * 100) + "%"; bar.prepend(d); };
  seg("windup", 0, A.w); seg("strike", A.w, A.w + A.s); seg("recover", A.w + A.s, tot);
  $("scrub").max = tot;
  $("cap-name").textContent = A.name;
  $("cap-desc").textContent = A.desc;
}
function setBoss(key) {
  state.boss = key;
  state.idx = 0;
  const B = BOSSES[key];
  document.documentElement.dataset.boss = key;
  $("title").textContent = B.title;
  $("tab-drakhaal").setAttribute("aria-pressed", String(key === "drakhaal"));
  $("tab-nameless").setAttribute("aria-pressed", String(key === "nameless"));
  $("stats").textContent = `${B.sub} · ${B.hp} HP · mierka 2× · ${B.parts} častí modelu`;
  $("lore").textContent = B.lore;
  floor.material.map = floorTexture(...B.floor);
  floor.material.needsUpdate = true;
  camera.position.copy(B.cam[0]);
  controls.target.copy(B.cam[1]);
  drak.holder.visible = key === "drakhaal";
  nameless.holder.visible = key === "nameless";
  renderList();
  timeline();
}

function frame(t) {
  nb = 0; nf = 0;
  for (const L of Object.values(layers)) L.n = 0;
  const A = currentAttack();
  const S = { phase: state.phase, age: state.age, vis: true, pos: HOME.clone(), face: null, flying: false };
  hatchlings.forEach(h => h.holder.visible = false);
  echoes.forEach(e => e.holder.visible = false);
  let playerBase = state.boss === "drakhaal" ? TGT.clone() : NTGT.clone();
  if (state.boss === "drakhaal") {
    const m = drak;
    m.reset();
    m.model.children.forEach(() => {});
    A.run(t, S, m);
    if (S.flying && !S.diving) beat(m, state.age);
    else m.parts.hips.position.y += Math.sin(state.age * 0.12);
    m.holder.position.copy(S.pos);
    m.holder.visible = S.vis;
    if (S.flying) stream("reverse", 500, state.age, Math.floor(state.age) - 25, Math.floor(state.age), 2, at(S.pos, 2.5), { up: -0.35, sp: 1.6, life: 14 });
    face(m.holder, S.pos, S.face || TGT);
    m.holder.rotation.z = (S.flip || 0) * Math.PI / 2;
    m.glow.opacity = glowDrak(state.age, { ...S, phase: state.phase }) / 255;
    m.model.children.forEach(() => {});
    tint(m, S.hurt);
    if (S.hatch) hatchlings.forEach((h, k) => {
      h.holder.visible = true;
      h.reset();
      h.holder.position.set(k ? 2.6 : -2.6, 0.6 + Math.sin(state.age * 0.3 + k) * 0.2, 0.4);
      face(h.holder, h.holder.position, TGT);
    });
  } else {
    const m = nameless;
    S.rooted = state.phase < 2;
    S.dropped = state.phase;
    S.anchor = V(0, 0, 0);
    m.reset();
    A.run(t, S, m);
    if (!S.skipIdle && A.id !== "DEATH") {
      if (S.rooted) nIdle(m, state.age); else nSwim(m, state.age, 0.55);
    }
    S.crown = S.crown || idleCrown(S);
    const look = S.face || (S.playerPos || NTGT);
    const body = face(m.holder, S.crown, look);
    m.holder.position.copy(S.crown);
    const w = S.anchor.clone().sub(S.crown), beta = Math.PI - body, k = 8;
    const lx = w.x * Math.cos(beta) - w.z * Math.sin(beta), lz = w.x * Math.sin(beta) + w.z * Math.cos(beta);
    solve({ ax: -lx * k, ay: -w.y * k + 24.016, az: lz * k, rooted: S.rooted, body, dropped: S.dropped, hatch: !!S.hatch });
    m.holder.visible = S.vis;
    m.glow.opacity = (S.glow ?? (state.phase >= 2 ? pulse(state.age, 0.25, 190) : pulse(state.age, 0.06, 160))) / 255;
    if (!S.rooted) stream("cloud", 510, state.age, Math.floor(state.age) - 20, Math.floor(state.age), 1, at(S.crown, 0.3), { c: "#c9c2ba", g: -0.01, up: 0, L: "s", life: 20, sp: 0.6 });
    for (const e of S.echo || []) {
      const g = echoes[e.k];
      g.holder.visible = true;
      g.reset();
      g.holder.position.copy(e.E);
      face(g.holder, e.E, NTGT);
      g.ghost.opacity = (150 / 255) * Math.min(1, e.age / 6) * Math.min(1, (44 - e.age) / 8);
      const lag = Math.max(0, e.age - 1.5);
      if (e.k === 0) g.play(lag + 7, [0, 12, 18, 21, 44, 52], ["IDLE", "FURROW_RAISE", "FURROW_RAISE", "FURROW_SLAM", "FURROW_SLAM", "IDLE"]);
      if (e.k === 1) { const arm = g.parts.right_arm; arm.rotation.x += lag < 14 ? -Math.PI * ease(lag / 4) : lerp(-Math.PI, -0.4, ease((lag - 14) / 6)); }
      if (e.k === 2) g.play(lag, DK.TENT[0], DK.TENT[1]);
    }
  }
  const pl = S.player || {};
  const pb = S.playerPos || playerBase;
  player.visible = $("opt-target").checked;
  player.position.set(pb.x + (pl.x || 0), pl.y || 0, pb.z + (pl.z || 0));
  player.rotation.y = Math.atan2(-(player.position.x - (state.boss === "drakhaal" ? S.pos.x : S.crown.x)), -(player.position.z - (state.boss === "drakhaal" ? S.pos.z : S.crown.z)));
  for (let i = nb; i < blocks.length; i++) blocks[i].visible = false;
  for (let i = nf; i < flashes.length; i++) flashes[i].visible = false;
  for (const L of Object.values(layers)) {
    const g = L.pts.geometry;
    g.setDrawRange(0, L.n);
    g.attributes.position.needsUpdate = g.attributes.color.needsUpdate = true;
  }
}
function tint(m, hurt) {
  const c = hurt ? 0xff7a7a : 0xffffff;
  for (const p of Object.values(m.parts)) if (p.userData.meshes) p.userData.meshes[0].material.color.setHex(c);
}

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  composer.setSize(r.width, r.height);
  bloom.setSize(r.width, r.height);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const A = currentAttack(), tot = totalOf(A, { phase: state.phase });
  state.age += dt * 20;
  if (state.playing) {
    state.t += dt * 20 * state.speed;
    if (state.t > tot) state.t = state.loop ? 0 : tot;
  }
  controls.autoRotate = $("opt-orbit").checked;
  controls.update();
  frame(state.t);
  $("head").style.left = `calc(${state.t / tot * 100}% - 1px)`;
  $("scrub").value = state.t;
  $("tick").textContent = `${Math.floor(state.t)} / ${tot} t`;
  composer.render();
  requestAnimationFrame(loop);
}

const phaseSel = document.createElement("label");
phaseSel.innerHTML = 'Fáza <select id="opt-phase"><option value="0">1 (100–66 %)</option><option value="1">2 (66–33 %)</option><option value="2">3 (pod 33 %)</option></select>';
document.querySelector(".toggles").prepend(phaseSel);
$("opt-phase").onchange = e => { state.phase = +e.target.value; const A = currentAttack(); if (A.minPhase && state.phase < A.minPhase) select(BOSSES[state.boss].attacks.findIndex(a => !a.minPhase)); timeline(); };
$("tab-drakhaal").onclick = () => setBoss("drakhaal");
$("tab-nameless").onclick = () => setBoss("nameless");
$("play").onclick = () => { state.playing = !state.playing; $("play").textContent = state.playing ? "Pauza" : "Prehrať"; $("play").setAttribute("aria-label", state.playing ? "Pozastaviť" : "Prehrať"); };
$("play").textContent = state.playing ? "Pauza" : "Prehrať";
$("speed").onchange = e => state.speed = +e.target.value;
$("scrub").oninput = e => { state.t = +e.target.value; };
$("opt-loop").onchange = e => state.loop = e.target.checked;
addEventListener("keydown", e => {
  if (e.target.closest("input, select")) return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { const n = BOSSES[state.boss].attacks.length; select((state.idx + (e.key === "ArrowDown" ? 1 : n - 1)) % n); e.preventDefault(); }
});
setBoss(location.hash === "#nameless" ? "nameless" : "drakhaal");
resize();
requestAnimationFrame(loop);
</script>
